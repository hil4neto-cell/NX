<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body style="margin:0;background:#f4f6f8;color:#18212f;font-family:Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px;background:#f4f6f8;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border-radius:16px;overflow:hidden;">
            <tr>
              <td style="padding:30px 32px 8px;background:#0b1320;color:#ffffff;">
                <p style="margin:0;color:#fdba74;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;">NX Projetos</p>
                <h1 style="margin:12px 0 0;font-size:28px;line-height:1.2;">Seu código de acesso</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:28px 32px 32px;">
                <p style="margin:0 0 18px;font-size:16px;line-height:1.6;">Use este código para entrar no seu espaço de trabalho no NXGEO:</p>
                <p style="margin:0 0 24px;padding:18px;border-radius:12px;background:#fff7ed;color:#9a3412;font-family:Arial,sans-serif;font-size:30px;font-weight:700;letter-spacing:7px;text-align:center;">{{ .Token }}</p>
                <p style="margin:0;color:#566274;font-size:14px;line-height:1.6;">O código é pessoal, vale apenas uma vez e deve ser digitado na tela do NXGEO. Se você não solicitou este acesso, pode ignorar este e-mail.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
